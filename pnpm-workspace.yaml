  '@tanstack/react-query': 5.104.5 # 2026-10-19 yayınlandı (latest=5.105.0 ÇOK YENİ, 2026-10-26)
  # react-hook-form: dist-tag "latest" (2026-10-23) — 8 gün, eşik üstü ama dar.
  'react-hook-form': 7.91.0 # 2026-10-23 yayınlandı
