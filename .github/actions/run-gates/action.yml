name: 'Beşli kapıyı çalıştır'
description: >-
  Dört uygulama/paylaşılan hattın ortak doğrulama sırası — lint → typecheck →
  test → izolasyon süiti → build. Bu, kapının TEK TANIM YERİDİR (T-003
  "sonraki sürümler için additive sözleşme"); v0.0.13'ten itibaren eklenen
  izolasyon süiti adımı buraya, tek yere eklendi.

inputs:
  filter:
    description: >-
      turbo'nun --filter değeri (ör. "@arkesoft/api..." veya "./packages/**").
      Hattın kapsamını belirler; bağımlılıkları dahil etmek için "..." eki
      çağıran tarafından eklenir. "./packages/*" DEĞİL — tek seviyeli glob "/"
      ayırıcısını geçmediği için "packages/themes/<tema>" gibi İÇ İÇE paketleri
      kaçırır (T-003 solid tur 2 M2-4; düzeltme turu 3 C1 — bu örnek
      güncellendi, bu composite beşli kapının TEK tanım yeri).
    required: true
  run-test:
    description: >-
      'false' ise test adımı atlanır. "shared" hattı 'false' verir — kendi
      test script'i olan paketler (api/db/errors) zaten "api" hattının
      kapanışında; sessiz bir boşluk bırakmamak için burada tekrar KOŞULMAZ,
      bilinçli olarak YOK (T-003 K-B2.7).
    required: false
    default: 'true'
  run-isolation:
    description: >-
      'false' ise tenant izolasyon süiti adımı (ROADMAP v0.0.13, T-005)
      atlanır. VARSAYILAN 'true' — FAIL-CLOSED (architect riski 8): yeni
      eklenen bir hat bu gate'i OTOMATİK alır, kendisi atlamayı AÇIKÇA
      seçmek zorundadır. Bugün DB'si OLMAYAN dört hat ("admin", "superadmin",
      "storefront", "shared") bunu AÇIKÇA 'false' geçer — "api" hattı
      varsayılanı (yani 'true') kullanır. Biri bunu unutursa o hat izolasyon
      süitini Postgres OLMADAN koşturmaya çalışır ve SESSİZCE atlamak yerine
      GÜRÜLTÜLÜ KIRMIZI verir — yön bilinçli (sessiz atlama > gürültülü
      kırmızı, architect riski 8'in izin verdiği yön).
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # Dördü de "FILTER" değerini "run:" bloğunun İÇİNDE değil "env:" üzerinden
    # alır (T-003 düzeltme turu 1, security B1). Bugün beş çağrı yerinin
    # (ci.yml) hepsi literal değer geçiyor, sömürülebilir değil — ama bu
    # composite beşli kapının TEK tanım yeri ve additive büyüme noktası;
    # "filter:" girdisi ileride olay verisinden (PR etiketi/dal adı) beslenirse
    # "${{ inputs.filter }}" bir "run:" bloğunun içinde METİNSEL olarak yerine
    # konurdu (bash tırnakları görmeden) → komut enjeksiyonu. "$FILTER"
    # kullanımı bunu yapısal olarak kapatır.
    - name: Lint
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm exec turbo run lint --filter="$FILTER"

    - name: Tip denetimi
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm exec turbo run typecheck --filter="$FILTER"

    # ROADMAP v0.0.20.1 (T-022/S7) — ham vitest çıktısı KIRMIZIDA artefakt
    # olarak yüklenir ("api" job'undaki iki izlenen flake, AGENT_BASELINE
    # "ÖLÇÜM DİSİPLİNİ" uyarısı — üç ajan ham "expect" çıktısını kesmişti,
    # kayıt yoktu). "2>&1 | tee <dosya>" TEK BAŞINA YETERSİZ: kabuk "tee"nin
    # çıkış kodunu döner, test düşse bile adım YEŞİL raporlanırdı (bu
    # sürümün kendi sahte-yeşil yasağının ihlali) — "set -o pipefail" bunu
    # kapatır, pipeline'ın çıkış kodu "pnpm"in gerçek kodu olur.
    #
    # ⚠⚠ FIX turu 1 (T-022/S7, security F1 "medium") — DÜZELTME: "tee"DEN
    # ÖNCE bir redaksiyon süzgeci (`scripts/redact-test-log.ts`) eklendi.
    # Depo PUBLIC (ölçüldü) ve bu artefakt ANONİM indirilebilir; bazı
    # assertion'lar TASARIM GEREĞİ ham sır basıyor (otpauth secret, oturum
    # çerezi, BETTER_AUTH_SECRET, ham Set-Cookie, bkz. süzgecin kendi başlık
    # yorumu). Süzgeç SATIR SİLMEZ — yalnızca sır biçimli jetonu maskeler;
    # "Expected:"/"Received:"/"AssertionError" satırları (sır biçimiyle
    # ÇAKIŞMADIKLARI sürece) aynen kalır, bu adımın VAROLUŞ SEBEBİ (iki
    # flake'in ham diff'i) KORUNUR. Süzgeç ÖNCE geldiği için hem konsol
    # çıktısı hem "tee"nin yazdığı artefakt dosyası AYNI ANDA redakte edilir.
    # "pipefail" ile ÇELİŞMEZ: süzgeç normal akışta HER ZAMAN exit 0 döner
    # (kendi hatasını yutar, bkz. dosya başı yorumu) — pipeline'ın çıkış kodu
    # pipefail altında hâlâ "pnpm"in gerçek koduna eşittir (ortadaki
    # aşamalardan biri başarısız OLMADIĞI sürece, ki normal akışta olmaz).
    - name: Birim/entegrasyon testleri
      if: ${{ inputs.run-test == 'true' }}
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: |
        set -o pipefail
        pnpm exec turbo run test --filter="$FILTER" 2>&1 \
          | node scripts/redact-test-log.ts \
          | tee /tmp/arkesoft-ci-test-output.log

    # "test" görevinin REDAKTE EDİLMİŞ çıktısı — yalnızca BU adım
    # başarısız olduğunda yüklenir ("failure()": şu ana kadar işte bir adım
    # düşmüş olmalı). Adım koşmadıysa (ör. test adımından ÖNCEKİ
    # lint/typecheck düştüyse) dosya hiç üretilmez; "actions/upload-artifact"
    # bunu sessizce "0 dosya" ile raporlar, job'u KIRMAZ (mevcut "Playwright
    # artefaktlarını yükle" adımıyla aynı davranış, ci.yml). Ad
    # "test-output-${{ github.job }}" — bu composite BEŞ farklı job'tan
    # (api/admin/superadmin/storefront/shared/theme-sdk) çağrılıyor;
    # "github.job" olmadan aynı isimle paralel yükleme GitHub'ın "ad zaten
    # var" hatasıyla çakışırdı. "retention-days: 1" (FIX turu 1, security F1)
    # — bu artefakt bir flake teşhis aracıdır, 7 günlük pencere ANONİM
    # indirme yüzeyini gereksiz uzatıyordu; süzgeç eklendiği için risk zaten
    # düşük ama 1 gün savunma derinliği olarak KORUNUYOR.
    - name: Test çıktısını artefakt olarak yükle (başarısızlıkta)
      if: ${{ inputs.run-test == 'true' && failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-output-${{ github.job }}
        path: /tmp/arkesoft-ci-test-output.log
        retention-days: 1

    # ROADMAP v0.0.13 (T-005/S5, K-E9) — "test" İLE "build" ARASINDA, 5.
    # adım. Ayrı bir CI job'u OLARAK AÇILMADI (K-E9 ile reddedildi — ikinci
    # "services: postgres" iki kat CI dakikası, sıfır kazanç); bu composite
    # beşli kapının TEK tanım yeri olduğu için izolasyon süiti de BURAYA,
    # aynı sıralı adım listesine eklendi. "run-isolation" girdisi yukarıdaki
    # notta açıklanan fail-closed varsayılanı taşır. turbo "test" görevi İLE
    # bu görevi AYNI invocation'da PLANLAMAZ (ikisi ayrı "run:" adımı —
    # GitHub Actions adımları SIRALI koşar) — bkz. turbo.json içindeki ilgili
    # görev yorumu (eşzamanlılık ölçümü ve kararı).
    #
    # ROADMAP v0.0.20.1 (T-022/S7) — AYNI pipefail gerekçesi (yukarıdaki
    # "Birim/entegrasyon testleri" notuna bakın) ve AYRI bir log dosyası:
    # "test" ve "test:isolation" AYRI turbo görevleri, iki izlenen flake
    # BİRBİRİNDEN FARKLI süitte gözlemlendi (AGENT_BASELINE) — tek dosyaya
    # yazsalardı ikinci koşum birinciyi EZERDİ.
    #
    # ⚠⚠ FIX turu 1 (T-022/S7, security F1) — AYNI redaksiyon süzgeci, AYNI
    # gerekçe (yukarıdaki "Birim/entegrasyon testleri" notuna bakın).
    - name: Tenant izolasyon süiti (ROADMAP v0.0.13)
      if: ${{ inputs.run-isolation == 'true' }}
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: |
        set -o pipefail
        pnpm exec turbo run "test:isolation" --filter="$FILTER" 2>&1 \
          | node scripts/redact-test-log.ts \
          | tee /tmp/arkesoft-ci-isolation-output.log

    # Aynı gerekçe (yukarıdaki "Test çıktısını artefakt olarak yükle" notu)
    # — ayrı ad ("isolation-output-…") ve ayrı dosya, aynı sebepten.
    # "retention-days: 1" — aynı gerekçe (yukarıdaki not, security F1).
    - name: İzolasyon süiti çıktısını artefakt olarak yükle (başarısızlıkta)
      if: ${{ inputs.run-isolation == 'true' && failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: isolation-output-${{ github.job }}
        path: /tmp/arkesoft-ci-isolation-output.log
        retention-days: 1

    - name: Derleme
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm exec turbo run build --filter="$FILTER"
