name: ci

# Tetikleyici BİLEREK filtresiz: "paths:"/"paths-ignore:"/"branches:" YOK.
# Gerekçe (T-003 K-B2): filtre iş akışı seviyesinde olursa eşleşmeyen PR'da
# bu iş akışı HİÇ başlamaz → GitHub'a check raporlanmaz → zorunlu check
# sonsuza dek "bekliyor"da kalır ve PR asla birleştirilemez. Hangi hattın
# koşacağı iş akışı seviyesinde değil, aşağıdaki "plan" job'unun ürettiği
# job seviyesindeki "if:" koşullarıyla belirlenir.
on:
  pull_request:
  push:
    branches: [main]

# En az ayrıcalık: tüm iş akışı salt okuma. Hiçbir job yazma izni
# YÜKSELTMEZ (sürüm PR'ı açma gibi yazma gerektiren işler release.yml'de).
permissions:
  contents: read

# Aynı dal/PR için eski koşum, yenisi başlayınca iptal edilir — asılı kalan bir
# "services:" sağlık kontrolü veya kasıtlı uzun bir test CI dakikasını sonsuza
# dek işgal edemez, birleştirme kuyruğu kendi kendini DoS'layamaz (T-003
# düzeltme turu 1, security C3).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # plan — hangi hatların koşacağına karar verir. Mekanizma: turbo'nun
  # bağımlılık grafiğinden türeyen "--affected" kümesi + açık kök-dosya
  # kuralı + şema/komut hatasında fail-open (tüm hatlar koşar). Elle yazılan
  # bir yol listesi YOK — öyle bir liste paylaşılan paketleri kopyalayarak
  # kaçınılmaz şekilde gerçek bağımlılık grafiğinden sapar (T-003 K-B2.2).
  # ---------------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api: ${{ steps.decide.outputs.api }}
      admin: ${{ steps.decide.outputs.admin }}
      superadmin: ${{ steps.decide.outputs.superadmin }}
      storefront: ${{ steps.decide.outputs.storefront }}
      shared: ${{ steps.decide.outputs.shared }}
      # ROADMAP v0.0.9, T-010/S9 (R-A) — "theme-sdk" job'u için ayrı çıktı.
      # Ad BİLEREK tireSİZ ("themeSdk"): bu değer aşağıda bir "if:" ifadesinde
      # nokta erişimiyle okunuyor ("needs.plan.outputs.themeSdk") — ifade
      # motorunda "-" çıkarma (subtraction) operatörüdür, "theme-sdk" yazımı
      # "theme" EKSİ "sdk" olarak ayrıştırılırdı (iş akışı job'unun kendi
      # tire'li kimliği "theme-sdk" bundan ETKİLENMEZ, çünkü o yalnızca bir
      # YAML harita anahtarı/liste öğesi, ifade erişimi DEĞİL).
      themeSdk: ${{ steps.decide.outputs.themeSdk }}
      # ROADMAP v0.0.19, T-020/S8 — "e2e" job'u için ayrı çıktı. Elle yazılan
      # bir regex YOK: bu bayrak, AŞAĞIDA ZATEN türetilmiş olan api/admin/
      # storefront/shared bayraklarının BİLEŞİMİ (api ∪ admin ∪ storefront ∪
      # shared — "shared" packages/themes/** değişikliğini de kapsıyor,
      # yukarıdaki "shared" tanımına bakın) — fail-open/kök-dosya kuralı
      # dalında DİĞER ALTISIYLA BİRLİKTE true olur, aksi hâlde türetilir.
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      - name: Depoyu checkout et (tam geçmiş — affected hesaplaması için)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace
        with:
          create-env: 'false'

      - name: Temel ve baş referanslarını belirle
        id: refs
        env:
          # Hepsi env: üzerinden geçer — run: bloğunun İÇİNDE hiçbir
          # "${{ }}" kalıbı YOK (mekanik grep ile doğrulanabilir olsun diye
          # bilinçli, tek tip kural — tek tek "bu değer güvenli mi" kararı
          # vermek yerine).
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Etkilenen hatları hesapla (turbo --affected + kök-dosya kuralı + fail-open)
        id: decide
        env:
          TURBO_SCM_BASE: ${{ steps.refs.outputs.base }}
          TURBO_SCM_HEAD: ${{ steps.refs.outputs.head }}
        shell: bash
        run: |
          set -uo pipefail

          api=false
          admin=false
          superadmin=false
          storefront=false
          shared=false
          theme_sdk=false
          e2e=false

          root_rule=false
          root_rule_unresolved=false
          dry_ok=false
          schema_ok=false
          names=""
          shared_names=""

          # --- Açık kök-dosya kuralı -------------------------------------
          # turbo'nun kendi semantiğine bel bağlamadan: bu dosyalardan biri
          # değiştiyse TÜM hatlar koşar. Base/head çözülemezse ya da "git diff"
          # başarısız olursa "root_rule_unresolved=true" işaretlenir — bu durum
          # SESSİZCE "false"a düşmez: aşağıdaki genel fail-open bu bayrağı da
          # okur VE özete AYRI bir gerekçe satırı yazar (K-B2.5'in üçüncü
          # koşulu — "base SHA çözülemezse" — artık turbo'nun da çökmesine bel
          # bağlamıyor; T-003 solid tur 1 M3 / security C3).
          root_file_pattern='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|package\.json|\.nvmrc|tsconfig[^/]*\.json)$|^\.changeset/config\.json$|^\.github/'

          if [ -n "$TURBO_SCM_BASE" ] && [ -n "$TURBO_SCM_HEAD" ]; then
            if changed_files="$(git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" 2>/tmp/plan-diff.log)"; then
              if printf '%s\n' "$changed_files" | grep -Eq "$root_file_pattern"; then
                root_rule=true
              fi
            else
              root_rule_unresolved=true
            fi
          else
            root_rule_unresolved=true
          fi

          # --- turbo --affected --dry=json --------------------------------
          # Çıkış kodu DOLAYLI "$?" İLE DEĞİL, komutun kendisiyle "if" koşulunda
          # doğrudan okunuyor (shellcheck SC2181 — actionlint "0 bulgu" şartı;
          # ayrıca bu, aradaki başka bir komutun "$?"ı sessizce EZMESİ riskini
          # de yapısal olarak kapatır).
          if raw_json="$(pnpm exec turbo run build --affected --dry=json 2>/tmp/plan-turbo.log)"; then
            dry_ok=true
          fi

          # "jq -re '.packages[]'" İKİ AYRI "boş" durumunu AYIRMIYORDU: alan
          # hiç yok/"null" (gerçek şema hatası) İLE alan VAR ama dizi boş
          # (HİÇBİR paket etkilenmedi — geçerli sonuç) ikisi de "-e" bayrağının
          # "üretilen çıktı yok" kuralıyla AYNI çıkış kodunu (4) veriyordu
          # (kabukta ÖLÇÜLDÜ: `echo '{"packages":[]}' | jq -re '.packages[]'`
          # → exit 4). Bu, "scripts/", "docs/", "ROADMAP.md" gibi hiçbir
          # workspace paketini etkilemeyen HER PR'da fail-open'ı YANLIŞ
          # GEREKÇEYLE tetikliyordu (T-003 düzeltme turu 3 — solid-tur3 low L2,
          # kabuk ölçümüyle doğrulandı, gerçek bir kusur). Düzeltme: ÖNCE
          # alanın VARLIĞINI/null-OLMAMASINI ayrı doğrula ("jq -e '.packages'"
          # — boş dizi "null"/"false" DEĞİLDİR, exit 0 verir), SONRA "-e"
          # OLMADAN yinele ("jq -r '.packages[]'" — boş dizide exit 0, yalnızca
          # GERÇEK bir tip hatasında/eksik alanda hata verir). "shared_names"
          # için aşağıda (M2-2) kurulan "hata ≠ geçerli-ama-boş" ayrımının
          # AYNISI.
          if [ "$dry_ok" = true ]; then
            if printf '%s' "$raw_json" | jq -e '.packages' >/dev/null 2>/tmp/plan-jq.log; then
              if names="$(printf '%s' "$raw_json" | jq -r '.packages[]' 2>>/tmp/plan-jq.log)"; then
                schema_ok=true
              fi
            fi
          fi

          # "shared" artık elle yazılmış bir paket regex'ine değil, AYNI
          # "--dry=json" çıktısından türetilen bir kümeye bağlı: "packages/"
          # altındaki her görevin "package" alanı — AMA SALT ".tasks[]"ten
          # değil, ".packages[]" (gerçekten ETKİLENEN küme, "$names") ile
          # KESİŞTİRİLMİŞ olarak. Elle liste gerçek bağımlılık grafiğinden
          # kaçınılmaz olarak sapar (K-B2.2 — bağlayıcı gerekçe); bu küme
          # turbo'nun kendi çıktısından türediği için sapamaz (T-003 solid tur
          # 1 M2). KESİŞİM ZORUNLU (T-003 solid tur 2 D1): ".tasks[]" GÖREV
          # GRAFİĞİNİN TAMAMIDIR — "turbo.json"daki "dependsOn: [\"^build\",
          # \"generate\"]" yüzünden ETKİLENMEYEN bağımlılıkları da içerir (ör.
          # "apps/api" altında tek satır değişse "@arkesoft/config#build" gibi
          # görevler grafiğe girer). Kesişim olmadan "shared" PRATİKTE HER
          # UYGULAMA DEĞİŞİKLİĞİNDE koşardı (yön güvenli — fazla koşmak az
          # koşmaktan iyidir — ama boşa CI dakikası + aşağıdaki özet metninin
          # "etkilenen paketler" demesi YANLIŞ olurdu, bunlar etkilenen değil,
          # grafikteki paketlerdi). Çıkış kodu AÇIKÇA ele alınır (T-003 solid
          # tur 2 M2-2): "set -uo pipefail" devrede olduğu için pipeline'ın
          # kendi exit kodu "jq"nun hatasını taşır ("sort -u" boş girdide 0
          # ile çıkar) — önceki tasarım bu kodu HİÇ okumuyordu. "jq" şema
          # hatasıyla çökerse (ör. ".directory" null/eksik → "startswith"
          # tip hatası) *hata*, "$shared_names" BOŞ ama "jq" başarılıysa
          # (hiçbir görev "packages/" altında değil VEYA etkilenen küme ile
          # kesişmiyor) bu *geçerli sonuç* — ikisi AYRI ele alınır: hata →
          # "schema_ok=false" (aşağıdaki genel fail-open'ı tetikler ve özete
          # gerekçe yazılır), geçerli boş sonuç → "shared_names" boş kalır,
          # fail-open TETİKLENMEZ, "shared=false" olarak değerlendirilir
          # (aşağıda, "names" bloğunda).
          if [ "$schema_ok" = true ]; then
            if ! shared_names="$(printf '%s' "$raw_json" | jq -r '
                [.packages[]] as $affected
                | .tasks[]
                | select((.package | IN($affected[])) and (.directory | startswith("packages/")))
                | .package
              ' 2>/tmp/plan-shared-jq.log | sort -u)"; then
              schema_ok=false
            fi
          fi

          fail_open=false
          if [ "$dry_ok" = false ] || [ "$schema_ok" = false ] || [ "$root_rule_unresolved" = true ]; then
            fail_open=true
          fi

          {
            echo '## plan — hangi hatlar koşacak'
            echo
            if [ "$fail_open" = true ]; then
              echo '**fail-open devrede** — tüm hatlar koşuyor. Gerekçe(ler):'
              echo
              # T-003 düzeltme turu 3 B: önceki metin "ayrıntı: job
              # loglarındaki /tmp/plan-diff.log" diyordu ama bu dosya (ve
              # kardeşleri /tmp/plan-turbo.log, /tmp/plan-jq.log,
              # /tmp/plan-shared-jq.log) hiçbir adımda "cat" EDİLMİYORDU —
              # "job logları"nda GÖRÜNEN TEK ŞEY bu cümlenin kendisiydi, dosya
              # değil (CLAUDE.md §4 "hatayı sessizce yutma" anlamında olmasa
              # da teşhis edilebilirliği öldüren yanlış bir yönlendirmeydi;
              # solid-tur3 medium). Düzeltme: log dosyalarının İÇERİĞİ artık
              # GERÇEKTEN bu özete ("$GITHUB_STEP_SUMMARY") basılıyor ve metin
              # buna göre doğru şeyi söylüyor ("aşağıda" — GitHub ifade kalıbı
              # BİLEREK YAZILMADI, bu "run:" bloğunun İÇİNDE olduğu için
              # YAZILIRSA GitHub'ın kendisi onu değerlendirmeye çalışır ve iş
              # akışı BOZULUR (T3-5 dersiyle AYNI sınıf — bkz. B1 adımındaki
              # "needle_a"/"needle_b" ayrımı); dosya üzerinden "cat").
              if [ "$root_rule_unresolved" = true ]; then
                # İçindeki ters tırnaklar Markdown kod gösterimi; GENİŞLEME
                # İSTENMİYOR (aşağıdaki "shellcheck disable" bunu bildirir —
                # actionlint "0 bulgu" şartı).
                # shellcheck disable=SC2016
                echo '- base SHA çözülemedi veya `git diff` başarısız oldu — ayrıntı aşağıda ("git diff hata günlüğü" bölümünde, varsa).'
                if [ -s /tmp/plan-diff.log ]; then
                  echo
                  echo '<details><summary>git diff hata günlüğü (/tmp/plan-diff.log)</summary>'
                  echo
                  echo '```'
                  cat /tmp/plan-diff.log
                  echo '```'
                  echo
                  echo '</details>'
                fi
              fi
              if [ "$dry_ok" = false ] || [ "$schema_ok" = false ]; then
                # Aynı gerekçe (yukarıdaki not).
                # shellcheck disable=SC2016
                echo '- `turbo --affected --dry=json` başarısız oldu ya da beklenen şemada değildi (`.packages[]`/`.tasks[]`) — ayrıntı aşağıda (varsa).'
                for plan_log_file in /tmp/plan-turbo.log /tmp/plan-jq.log /tmp/plan-shared-jq.log; do
                  if [ -s "$plan_log_file" ]; then
                    echo
                    echo "<details><summary>$(basename "$plan_log_file")</summary>"
                    echo
                    echo '```'
                    cat "$plan_log_file"
                    echo '```'
                    echo
                    echo '</details>'
                  fi
                done
              fi
            elif [ "$root_rule" = true ]; then
              echo 'kök-dosya kuralı tetiklendi: paylaşılan kök yapılandırma dosyalarından biri değişti. Tüm hatlar koşuyor.'
            else
              # Aynı gerekçe (yukarıdaki not).
              # shellcheck disable=SC2016
              echo 'turbo `--affected` çıktısı başarıyla ayrıştırıldı:'
              echo
              echo '```'
              printf '%s\n' "$names"
              echo '```'
              echo
              # Aynı gerekçe (yukarıdaki not).
              # shellcheck disable=SC2016
              echo '`packages/` altında GERÇEKTEN ETKİLENEN paketler (shared hattının kaynağı; `.packages[]` ile kesiştirilmiş, T-003 solid tur 2 D1 — bağımlılık grafiğindeki etkilenmeyen görevler artık dahil DEĞİL):'
              echo
              echo '```'
              printf '%s\n' "$shared_names"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail_open" = true ] || [ "$root_rule" = true ]; then
            api=true; admin=true; superadmin=true; storefront=true; shared=true; theme_sdk=true; e2e=true
          else
            printf '%s\n' "$names" | grep -Fxq '@arkesoft/api' && api=true
            printf '%s\n' "$names" | grep -Fxq '@arkesoft/admin' && admin=true
            printf '%s\n' "$names" | grep -Fxq '@arkesoft/superadmin' && superadmin=true
            printf '%s\n' "$names" | grep -Fxq '@arkesoft/storefront' && storefront=true
            # ROADMAP v0.0.9, T-010/S9 (R-A) — "theme-sdk" kendi ayrı hattını
            # "@arkesoft/theme-sdk" doğrudan (veya kapanışı) etkilendiğinde
            # alır; mekanizma admin/superadmin/storefront ile BİREBİR aynı.
            printf '%s\n' "$names" | grep -Fxq '@arkesoft/theme-sdk' && theme_sdk=true
            # shared: packages/ altındaki paketlerden en az biri etkilendiyse
            # true (kaynak: $shared_names — yukarıda --dry=json'dan türetildi,
            # elle regex YOK).
            if [ -n "$shared_names" ]; then
              shared=true
            fi
            # ROADMAP v0.0.19, T-020/S8 — "e2e" job'u api/admin/storefront'un
            # e2e spec'lerini VE (storefront'un "modern" teması üzerinden
            # render ettiği) paylaşılan paketleri kapsıyor; "superadmin" ve
            # "theme_sdk" BİLEREK kümede YOK (superadmin'in Playwright
            # projesi v0.0.20'ye bırakıldı, kullanıcı kararı — T-020 brief;
            # theme-sdk'ya workspace:* ile bağımlı hiçbir e2e akışı yok).
            if [ "$api" = true ] || [ "$admin" = true ] || [ "$storefront" = true ] || [ "$shared" = true ]; then
              e2e=true
            fi
          fi

          {
            echo "api=$api"
            echo "admin=$admin"
            echo "superadmin=$superadmin"
            echo "storefront=$storefront"
            echo "shared=$shared"
            echo "themeSdk=$theme_sdk"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # repo — hat'lardan bağımsız, PR başına tam bir kez koşan kontroller.
  # ---------------------------------------------------------------------
  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace

      - name: Biçim kontrolü
        shell: bash
        run: pnpm format:check

      - name: Ortam değişkeni şeması kontrolü
        shell: bash
        run: pnpm env:check

  # ---------------------------------------------------------------------
  # guards — statik denetimler + engellemeyen uyarılar. BİLEREK .env
  # ÜRETMEZ: bu job'un konusu tam olarak ".env olmadan her şey çalışıyor
  # mu" sorusu (AC12a); kendisi .env üretirse denetlediği şeyi ortadan
  # kaldırır (T-003 R-9).
  # ---------------------------------------------------------------------
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu checkout et (tam geçmiş — changeset karşılaştırması için)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Çalışma alanını hazırla (.env ÜRETİLMEZ)
        uses: ./.github/actions/setup-workspace
        with:
          create-env: 'false'

      - name: AC13 — yasak jeton taraması (negatif kriter)
        shell: bash
        run: |
          set -euo pipefail
          tokens_file=".github/ci-forbidden-tokens.txt"
          pattern_file="$(mktemp)"
          grep -v '^#' "$tokens_file" | grep -v '^[[:space:]]*$' > "$pattern_file"

          # Veri kaynağı koruması (fail-closed, T-003 security tur 1 B2) — liste
          # yanlışlıkla boşaltılırsa AŞAĞIDAKİ asıl tarama "hiçbir jeton yok"
          # diyerek SESSİZCE yeşile düşerdi. ÖNCEKİ tasarım bunu bir SAYIM
          # eşiğiyle (min_expected_patterns=10) koruyordu — ama dosyanın kendi
          # başlığı "geçici kapsam boşluğu işaretleri"nin PLANLI biçimde
          # silineceğini söylüyor: v0.0.22'den sonra tam SINIRDA (10),
          # v0.18.0'dan sonra bunun ALTINDA (7) → koruma MEŞRU bir sebeple
          # kendi kendine kırmızıya dönerdi; ayrıca "15 → 11" gibi HEDEFLİ bir
          # daraltma (ör. "geçici kapsam boşluğu işaretleri" bölümündeki tek
          # bir test raporlama aracı satırını silmek) sayı eşiğinin ÇOK
          # üstünde kalıp hiç yakalanmazdı (T-003 solid tur 2
          # B + security tur 2 B2, ORTAK kök neden). Düzeltme (bu tur da
          # genişletildi — T-003 düzeltme turu 3 A): sayım eşiği KALKTI;
          # ANA listedeki "KALICI" bölümü makine okunur işaretçilerle
          # ("# >>> PERMANENT" / "# <<< PERMANENT") sınırlı, bu bölüm
          # ÇIKARILIP BAĞIMSIZ referans dosyayla (ci-forbidden-tokens-
          # permanent.txt) "diff -u" ile ÇİFT YÖNLÜ karşılaştırılıyor. ÖNCEKİ
          # tur (qa/security/solid tur3) yalnızca "referans ⊆ ana liste" TEK
          # YÖNLÜ kontrol ediyordu; bu, kalıcı bir jetonun SADECE referanstan
          # silinmesini veya ana listeye YENİ bir kalıcı jeton eklenip
          # referansa eklenmemesini YAKALAMIYORDU (3 sandbox senaryosuyla
          # ampirik olarak kanıtlandı — bkz. qa-tur3 §1, security-tur3 B5).
          #
          # GARANTİ EDİLEN (çift yönlü "diff -u" sayesinde): bir KALICI
          # jetonun SADECE ana listeden silinmesi, SADECE referanstan
          # silinmesi, ana listeye YENİ bir KALICI jeton eklenip referansa
          # eklenmemesi, sıra değişikliği — hepsi "diff" farkı üretir → exit 1.
          # GARANTİ EDİLMEYEN: AYNI PR'da bir KALICI jetonun İKİ dosyadan
          # BİRLİKTE silinmesi — bu durumda çıkarılan bölüm ile referans dosya
          # yine birbiriyle eşleşir (ikisi de aynı satırı kaybeder), "diff"
          # fark görmez. Bu senaryo yalnızca `.github/**` için zorunlu gözden
          # geçirici (CODEOWNERS/branch protection) ile kapanır — bu, GitHub
          # kimliği/organizasyon kararı gerektirdiği için BİLİNÇLİ OLARAK
          # BORÇTA (Orkestratör/kullanıcı kararı); mekanik kontrol bunu
          # kendi başına kapatamaz.
          #
          # Referans liste BİLEREK ci.yml İÇİNDE bir bash dizisi olarak
          # YAZILMADI: bu adımın KENDİSİ "ci.yml" içinde ve "ci.yml" AC13'ün
          # TARAMA HEDEFİNDE — jetonlar burada bitişik yazılsaydı bu adım
          # KENDİ KENDİNİ eşler ve AC13 kalıcı kırmızı olurdu (R-6 ile AYNI
          # sınıf hata). Referans dosya da bu yüzden `.txt` — tarama hedefinin
          # (`*.yml`/`*.yaml`) dışında.
          permanent_tokens_file=".github/ci-forbidden-tokens-permanent.txt"
          if ! required_permanent="$(grep -v '^#' "$permanent_tokens_file" | grep -v '^[[:space:]]*$')"; then
            echo "::error::AC13 veri kaynağı bozuk: $permanent_tokens_file okunamadı."
            exit 1
          fi
          if [ -z "$required_permanent" ]; then
            echo "::error::AC13 veri kaynağı bozuk: $permanent_tokens_file boş — kalıcı jeton referansı okunamadı."
            exit 1
          fi

          # Ana listedeki "KALICI" bölümü işaretçiler arasından ÇIKAR.
          # İŞARETÇİ BULUNAMAZSA/BOZUKSA DA FAIL-CLOSED (işaretçiyi silmek bir
          # kaçış yolu OLMASIN).
          marker_begin='# >>> PERMANENT'
          marker_end='# <<< PERMANENT'
          extracted_permanent="$(mktemp)"
          marker_log="$(mktemp)"
          awk -v b="$marker_begin" -v e="$marker_end" '
            $0 == b { seen_begin++; flag = 1; next }
            $0 == e { seen_end++; flag = 0; next }
            flag { print }
            END {
              if (seen_begin == 0) print "MISSING_BEGIN" > "/dev/stderr"
              if (seen_end == 0) print "MISSING_END" > "/dev/stderr"
              if (seen_begin > 1) print "DUPLICATE_BEGIN" > "/dev/stderr"
              if (seen_end > 1) print "DUPLICATE_END" > "/dev/stderr"
            }
          ' "$tokens_file" > "$extracted_permanent" 2> "$marker_log"
          if [ -s "$marker_log" ]; then
            echo "::error::AC13 veri kaynağı bozuk: $tokens_file içinde \"$marker_begin\" / \"$marker_end\" işaretçileri bulunamadı veya bozuk."
            cat "$marker_log"
            exit 1
          fi

          if ! permanent_diff="$(diff -u <(printf '%s\n' "$required_permanent") "$extracted_permanent")"; then
            echo "::error::AC13 veri kaynağı bozuk: $tokens_file (işaretçiler arasındaki KALICI bölüm) ile $permanent_tokens_file ÇİFT YÖNLÜ eşit değil (bir satır eklenmiş/silinmiş/değiştirilmiş olabilir)."
            printf '%s\n' "$permanent_diff"
            exit 1
          fi
          echo "AC13 veri kaynağı: KALICI bölüm ile $permanent_tokens_file çift yönlü eşit."

          # R-6 kanıtı (1/2) — jeton dosyası TARAMA HEDEFİNE dahil edilirse
          # kendi kendini eşler (beklenen davranış, ama BU TARAMANIN BİR
          # PARÇASI DEĞİL — yalnızca ayrı bir kanıt adımında gösterilir).
          # Fail-closed (B2): eşleşme YOKSA bu öz-testin kendisi bozulmuş demektir
          # (liste boşaltılmış/bozulmuş olabilir) → artık yalnızca metin basmakla
          # kalınmaz, exit 1 verilir.
          echo 'R-6 kanıtı — jeton dosyası dahil edilirse (beklenen: eşleşme VAR):'
          if ! grep -nFf "$pattern_file" "$tokens_file"; then
            echo "::error::R-6 öz-testi başarısız: jeton listesi kendi dosyasında hiç eşleşmedi (liste muhtemelen boşaltıldı/bozuldu)."
            exit 1
          fi

          # Gerçek AC13 taraması — hedef yalnızca .yml/.yaml iş akışı ve
          # composite action dosyaları; .txt listesi glob'un DIŞINDA (R-6
          # kanıtı 2/2, aşağıda "eşleşme yok" bekleniyor). grep'in "eşleşme yok"
          # (exit 1) ile "hata" (exit >1, ör. okunamayan dosya) çıkışları ayrı
          # ayrı ele alınır — ikincisi de AC13'ü sessizce yeşile düşürmesin
          # (security tur 1 B2, "Ek not").
          targets="$(find .github/workflows .github/actions -type f \( -name '*.yml' -o -name '*.yaml' \))"
          # Bu hedef küme ("iş akışı + composite action dosyaları") aşağıdaki
          # "run bloğu içi şablon ifadesi yasağı" adımı TARAFINDAN DA
          # kullanılıyordu ve iki ayrı "find" çağrısı olarak TEKRARLANIYORDU
          # (T-003 düzeltme turu 3 C4 — aynı soruyu iki kopya yanıtlıyordu,
          # biri güncellenip diğeri unutulabilirdi). Artık TEK YERDE (burada)
          # türetiliyor ve o adım bunu dosyadan OKUYOR — job'un kendi
          # runner'ında "/tmp" adımlar arasında KALICIDIR.
          printf '%s\n' "$targets" > /tmp/ac-workflow-action-targets.txt
          echo 'R-6 kanıtı (2/2) — jeton dosyası hariç gerçek tarama hedefinde:'
          # T-003 ST-9 düzeltme turu 1, kusur 1 — gerçek (Ubuntu/GNU) runner'da
          # kırmızıya düşüyordu, yerelde (macOS/BSD) geçiyordu: "grep" EŞLEŞME
          # YOKKEN 1 ile çıkar (bu taramanın ARANAN/İYİ sonucu — hiç yasak jeton
          # yok demek); "xargs" alt sürecin 1..125 arası HER çıkış kodunu KENDİ
          # 123 koduna ÇEVİRİR (xargs(1): "if any invocation of the command
          # exits with a status of 1-125, xargs exits with status 123"). Alttaki
          # "grep_exit -gt 1" dalı bu 123'ü "gerçek okuma hatası" sanıp exit 1
          # veriyordu — yani AC13 "eşleşme yok" (geçmesi gereken) sonucu "hata"
          # ZANNEDİP düşüyordu. Düzeltme: "xargs" tamamen KALDIRILDI — hedef
          # küme bilinen/küçük (bugün 5 dosya, R-6 ile korunan .txt'ler hâlâ
          # dışında); dosya listesi bir diziye alınıp "grep"e doğrudan argüman
          # olarak verilir. Böylece "grep"in KENDİ 0/1/2 çıkış semantiği hiçbir
          # ara katman tarafından bozulmadan okunur (0 = eşleşme VAR → FAIL,
          # 1 = eşleşme YOK → PASS, ≥2 = gerçek hata, ör. dosya okunamadı →
          # FAIL). Hedef küme ileride büyüyüp "xargs" gerekirse, "xargs"ın 123
          # çıkışı "grep"in 1'ine (eşleşme yok) GERİ ÇEVRİLMEDEN kullanılamaz.
          # Diziye dönüştürme "mapfile" İLE DEĞİL ("mapfile"/"readarray" bash
          # 4+ gerektirir; runner'ın "ubuntu-latest" bash'i bunu karşılar ama
          # yerel iki yönlü doğrulama bu adımı macOS'un öntanımlı bash 3.2'sinde
          # de koşturabilsin diye taşınabilir "while read" ile yapılır — aynı
          # sonuç, daha geniş uyumluluk) bir "while read" döngüsüyle yapılır.
          target_array=()
          while IFS= read -r target_line; do
            [ -z "$target_line" ] && continue
            target_array+=("$target_line")
          done <<< "$targets"
          set +e
          match_output="$(grep -nFf "$pattern_file" "${target_array[@]}")"
          grep_exit=$?
          set -e
          if [ "$grep_exit" -eq 0 ]; then
            printf '%s\n' "$match_output"
            echo "::error::AC13 ihlali — yasak jeton .yml/.yaml dosyalarında bulundu."
            exit 1
          elif [ "$grep_exit" -gt 1 ]; then
            echo "::error::AC13 taraması hata verdi (grep exit $grep_exit) — pattern dosyası veya hedef dosyalar okunamadı."
            exit 1
          fi
          echo "AC13: yasak jeton bulunmadı."

      - name: Sabit Node sürümü yazımı yasağı (AC5) — pozitif iddia
        shell: bash
        run: |
          set -euo pipefail
          # Negatif taraf (sabit Node sürüm anahtarı yazımının, iş container'ı
          # anahtarının ve fork PR güvenlik tetikleyicisinin YOK olması) artık
          # yukarıdaki genel AC13 taramasına taşındı (bkz.
          # .github/ci-forbidden-tokens.txt — T-003 düzeltme turu 1 C6).
          # Bölünmüş string hilesi gereksizleşti: bu adımın kendi metni o üç
          # jetonun tam yazımını bitişik içermiyor (AC13'ün tarama hedefi tam
          # olarak bu dosya — T3-5 dersi). Burada yalnızca POZİTİF iddia
          # kalıyor: .nvmrc dosya referansı GERÇEKTEN kullanılıyor mu.
          if ! grep -rn 'node-version-file' .github/actions/setup-workspace/action.yml; then
            echo "::error::.nvmrc dosya referansı hiçbir yerde kullanılmıyor."
            exit 1
          fi
          echo "Node sürümü .nvmrc üzerinden okunuyor; sabit yazım yok (negatif kontrol: AC13)."

      - name: run bloğu içi şablon ifadesi yasağı — iş akışları + composite action'lar (security tur 1 B1)
        shell: bash
        run: |
          set -euo pipefail
          # GitHub'ın dolar + çift süslü parantezle başlayan ifade kalıbı
          # "run:" bloğunun İÇİNDE kullanılırsa metinsel olarak (bash
          # tırnaklarını görmeden) yerine konur. "run-gates" composite'i
          # (beşli kapının TEK tanım yeri) bugün dört çağrı yerinin hepsinde
          # literal değer geçiyor olsa da, girdi ileride olay verisinden
          # (PR etiketi/dal adı) beslenirse bu bir komut enjeksiyonu yüzeyi
          # olurdu. Bu kontrol o sınıfı MEKANİK olarak kapatır: hedef
          # dosyalardaki "run:" bloklarının İÇİNDE o kalıbı arar
          # (env:/with:/if:/outputs: serbest — onlar GitHub'ın kendi
          # değerlendirdiği YAML anahtarları, enjeksiyon yüzeyi değil).
          #
          # NOT: aranan jeton BİLEREK iki parçaya bölünmüş kuruluyor (T3-5
          # dersi) — bu adımın KENDİ "run:" bloğu da tarama hedefine dahil
          # (ci.yml); bitişik yazılırsa kendi kendini eşler. Aynı sebepten,
          # aşağıdaki mesajlarda kalıbın kendisi YAZILMAZ — yalnızca "$needle"
          # değişkeni (çalışma anında birleştirilmiş) basılır.
          #
          # AWK PROGRAMININ KENDİSİ artık bu adımın İÇİNDE DEĞİL —
          # `scripts/check-run-block-template-expression.sh`'e taşındı
          # (ROADMAP T-016/S12 fix turu 1, solid M-2). Bu adım ile yerel
          # "guards" kapısı (`scripts/guards.sh`, K-A14) AYNI 34 satırlık awk
          # programını BİREBİR KOPYA olarak İKİ YERDE taşıyordu — hedef küme
          # türetimi (`/tmp/ac-workflow-action-targets.txt`, aşağıda
          # DEĞİŞMEDİ) TEK YERDEN okunurken awk'ın KENDİSİ iki dosyada
          # SESSİZCE SAPABİLİRDİ (ölçüldü: devops T-016 fix turu 1 raporu).
          # Davranışta hiçbir değişiklik YOK: mesaj metinleri, hedef kaynağı,
          # exit kodu semantiği BİREBİR aynı — yalnızca awk'ın YAŞADIĞI dosya
          # değişti.
          needle_a='$'
          needle_b='{{'
          needle="${needle_a}${needle_b}"

          # Hedef küme burada TEKRAR "find" ile türetilmiyor — AC13 adımı
          # bunu TEK YERDE türetip "/tmp/ac-workflow-action-targets.txt"e
          # yazdı (T-003 düzeltme turu 3 C4); bu adım onu okur.
          targets="$(cat /tmp/ac-workflow-action-targets.txt)"
          violation=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! bash scripts/check-run-block-template-expression.sh "$needle" "$file"; then
              echo "::error::${file} içinde run: bloğu içinde \"$needle\" ile başlayan bir ifade bulundu (yukarıdaki satıra bakın; env: üzerinden geçirilmeli)."
              violation=true
            fi
          done <<< "$targets"

          if [ "$violation" = true ]; then
            exit 1
          fi
          echo "run: bloklarının içinde \"$needle\" ile başlayan bir ifade bulunmadı."

      - name: release.yml tetikleyici doğrulaması (AC8)
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'pull_request|workflow_dispatch|schedule' .github/workflows/release.yml; then
            echo "::error::release.yml yasaklı bir tetikleyici içeriyor."
            exit 1
          fi
          if ! grep -nE '^\s*branches:\s*\[main\]' .github/workflows/release.yml; then
            echo "::error::release.yml 'branches: [main]' içermiyor."
            exit 1
          fi
          echo "release.yml tetikleyicisi doğrulandı: yalnızca main'e push."

      - name: Platform sürüm tutarlılığı (--check)
        shell: bash
        run: node scripts/sync-platform-version.ts --check

      - name: Platform script'i — erasable syntax kısıtı + tip kontrolü (A4)
        shell: bash
        run: |
          set -euo pipefail
          # "scripts/" bir workspace paketi DEĞİL → "pnpm typecheck" (turbo)
          # bu dosyayı hiç görmüyordu; başlık yorumundaki üç sözleşme (any
          # yasağı, açık dönüş tipleri, SİLİNEBİLİR olmayan sözdizimi yasağı)
          # bugüne kadar yalnızca insan incelemesiyle korunuyordu
          # (T-003 solid tur 1 M4). ÖNCEKİ tasarım kaynak dosyayı komut
          # satırında veriyordu — TypeScript'in belgelenmiş davranışı gereği
          # bu durumda "scripts/tsconfig.json" TÜMÜYLE YOKSAYILIR (strict,
          # noUncheckedIndexedAccess, exactOptionalPropertyTypes hiç
          # uygulanmıyordu; T-003 solid tur 2 M2-3). Düzeltme: proje
          # dosyasıyla (-p) çalıştır — dosya adı komut satırında YOK,
          # "erasableSyntaxOnly" ve "typeRoots" artık tek yerde
          # (scripts/tsconfig.json) tanımlı.
          pnpm exec tsc -p scripts/tsconfig.json
          echo "scripts/sync-platform-version.ts: tsconfig.json'ın tam katılığıyla tip kontrolü geçti."

      - name: Platform script'i — ESLint (A4)
        shell: bash
        run: |
          set -euo pipefail
          # Aynı sebepten (yukarıdaki not) kök "package.json"da "eslint" yok;
          # "scripts/eslint.config.mjs" + "scripts/tsconfig.json" paketler
          # arası paylaşılan preset'i (packages/config/eslint/node.js)
          # genişletiyor ve @arkesoft/config'in KENDİ kurulu eslint
          # ikilisiyle çalıştırılıyor — yeni bağımlılık YOK.
          ./packages/config/node_modules/.bin/eslint --config scripts/eslint.config.mjs scripts
          echo "scripts/: ESLint temiz."

      - name: Sahte yeşil dedektörü — test sahibi paket kümesi
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -v '^#' .github/ci-expected-test-packages.txt | grep -v '^[[:space:]]*$' | sort)"
          # "2>/dev/null" stderr'i TÜMÜYLE atıyordu (T-003 düzeltme turu 3 B,
          # beşinci örnek) — "set -euo pipefail" sayesinde "turbo"/"jq" hata
          # verirse adım yine kırmızıya düşüyordu (davranış fail-closed ✓) ama
          # KIRMIZININ SEBEBİ hiç basılmıyordu. Düzeltme: stderr bir log
          # dosyasına alınır, hata dalında (aşağıda) adım çıktısına basılır.
          turbo_test_dry_log="$(mktemp)"
          if ! actual="$(pnpm exec turbo run test --dry=json 2>"$turbo_test_dry_log" \
            | jq -r '.tasks[] | select(.task == "test" and .command != "<NONEXISTENT>") | .package' \
            | sort -u)"; then
            echo "::error::Sahte yeşil dedektörü: \"turbo run test --dry=json\" ya da \"jq\" hata verdi."
            cat "$turbo_test_dry_log"
            exit 1
          fi
          if [ -s "$turbo_test_dry_log" ]; then
            echo "turbo stderr (komut 0 ile çıktı ama stderr'e yazdı):"
            cat "$turbo_test_dry_log"
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::Test sahibi paket kümesi ci-expected-test-packages.txt ile eşleşmiyor."
            echo "Beklenen:"
            printf '%s\n' "$expected"
            echo "Gerçek:"
            printf '%s\n' "$actual"
            exit 1
          fi
          echo "Test sahibi paket kümesi beyan ile eşleşiyor."

      - name: Sahte yeşil dedektörü — tenant izolasyon süiti paket kümesi (ROADMAP v0.0.13, T-005/S5)
        shell: bash
        run: |
          set -euo pipefail
          # Yukarıdaki "test sahibi paket kümesi" dedektörünün BİREBİR ikizi
          # (architect riski 6) — turbo'nun İLGİLİ görevi sahipsiz bir küme
          # üzerinde 0 görevle SESSİZCE yeşil olma yüzeyi burada da aynı:
          # beklenen küme (bugün tek satır, "@arkesoft/db" — V-P1)
          # "--dry=json" çıktısından türetilen GERÇEK kümeyle BİREBİR
          # eşleşmek zorunda.
          #
          # NOT (S4'ten devralınan uyarı): Vitest 5.0.5'te "vitest list"
          # "describe()" bir yardımcı FONKSİYON üzerinden çağrıldığında
          # ("createTenantIsolationSuite()" deseni) "No test suite found"
          # ile ÇÖKER — bu dedektör o komutu KULLANMIYOR. "turbo --dry=json"
          # ilgili görevi hiç ÇALIŞTIRMAZ (yalnızca statik görev grafiğini ve
          # içerik hash'lerini okur, komutu metin olarak RAPORLAR) — devops
          # tarafında yerel olarak AYRICA doğrulandı: aynı paket üzerinde
          # "vitest list" çöküyor ama "turbo run <görev> --dry=json" başarıyla
          # tam görev grafiğini üretiyor (rapora yapıştırıldı).
          isolation_expected_file=".github/ci-expected-isolation-packages.txt"
          expected="$(grep -v '^#' "$isolation_expected_file" | grep -v '^[[:space:]]*$' | sort)"
          turbo_isolation_dry_log="$(mktemp)"
          isolation_task_name="test:isolation"
          if ! actual="$(pnpm exec turbo run "$isolation_task_name" --dry=json 2>"$turbo_isolation_dry_log" \
            | jq -r --arg t "$isolation_task_name" \
              '.tasks[] | select(.task == $t and .command != "<NONEXISTENT>") | .package' \
            | sort -u)"; then
            echo "::error::Sahte yeşil dedektörü (izolasyon): \"turbo run $isolation_task_name --dry=json\" ya da \"jq\" hata verdi."
            cat "$turbo_isolation_dry_log"
            exit 1
          fi
          if [ -s "$turbo_isolation_dry_log" ]; then
            echo "turbo stderr (komut 0 ile çıktı ama stderr'e yazdı):"
            cat "$turbo_isolation_dry_log"
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::İzolasyon süiti sahibi paket kümesi $isolation_expected_file ile eşleşmiyor."
            echo "Beklenen:"
            printf '%s\n' "$expected"
            echo "Gerçek:"
            printf '%s\n' "$actual"
            exit 1
          fi
          echo "İzolasyon süiti sahibi paket kümesi beyan ile eşleşiyor."

      - name: AC4 — GUC jetonları yalnızca tenant-context.ts'te geçer (K-E12 mekanik kontrolü)
        shell: bash
        run: |
          set -euo pipefail
          # R-P3(b) — KAPSAM BAĞLAYICI: tarama hedefi "**/src/**/*.ts" EKSİ
          # "__tests__/**" — YALNIZCA "packages/db" DEĞİL, REPO GENELİNDE
          # ("apps/*/src", "packages/*/src"); K-E12'nin iddiası ("hiçbir yerde,
          # yalnızca tenant-context.ts'te") "apps/api" gibi tüketicileri de
          # kapsar — ham SQL'le GUC'u atlayan bir "apps/*" dosyası da bu
          # kontrolün yakalaması gereken sınıf. SQL ve markdown KAPSAM DIŞI.
          # Gerekçe: "migration-sql.test.ts" ve S4'ün izolasyon testleri bu
          # jetonları MEŞRU olarak fixture/test verisi olarak içeriyor
          # (migration SQL'i bağlı parametre KABUL ETMEZ — S4 ampirik olarak
          # ölçtü); kapsam "__tests__/**" dışına alınmazsa bu adım KALICI
          # YANLIŞ POZİTİF verir.
          #
          # R-P7 / §5 LİTERAL-JETON KURALI — bu kontrolün KENDİ metni
          # jetonları BİTİŞİK YAZMAZ (aksi hâlde kendi kendini eşler ve
          # AC4 kalıcı kırmızı olurdu, T-003'teki dört çıkışla AYNI sınıf
          # hata). Her jeton çalışma anında iki parçadan birleştirilir.
          guc_setting_a='app.'
          guc_setting_b='tenant_id'
          guc_setting="${guc_setting_a}${guc_setting_b}"
          guc_function_a='set_'
          guc_function_b='config'
          guc_function="${guc_function_a}${guc_function_b}"

          allowed_file='packages/db/src/tenant-context.ts'

          # Hedef küme: "apps/*/src/**/*.ts" + "packages/*/src/**/*.ts" EKSİ
          # "__tests__/**" — "find" ile türetilir, elle liste YAZILMAZ (yeni
          # paket/dosya eklendiğinde otomatik kapsanır).
          scan_targets="$(find apps packages -type f -name '*.ts' -path '*/src/*' -not -path '*/__tests__/*')"

          violation=false
          for needle in "$guc_setting" "$guc_function"; do
            matches_outside_allowed="$(printf '%s\n' "$scan_targets" \
              | grep -Fv "$allowed_file" \
              | xargs -r grep -ln -- "$needle" 2>/dev/null || true)"
            if [ -n "$matches_outside_allowed" ]; then
              echo "::error::AC4 ihlali — \"$needle\" jetonu $allowed_file DIŞINDA bulundu:"
              printf '%s\n' "$matches_outside_allowed"
              violation=true
            fi
          done

          if [ "$violation" = true ]; then
            exit 1
          fi
          echo "AC4: GUC jetonları yalnızca $allowed_file içinde geçiyor."

      - name: AC12a — .env OLMADAN çalışma probu
        shell: bash
        env:
          # .env.example'ın DATABASE_URL değeriyle birebir aynı (dev-only,
          # sır DEĞİL). prisma.config.ts bu değişkeni OKUYOR ama "validate"
          # komutu hiçbir bağlantı AÇMIYOR — host/şifre burada kullanılmıyor,
          # sadece Prisma'nın yapılandırma yükleyicisinin çökmemesi için VAR.
          DATABASE_URL: postgresql://arkesoft:arkesoft_dev_only@localhost:5432/arkesoft?schema=public
        run: |
          set -euo pipefail
          pnpm --filter @arkesoft/db exec vitest list
          pnpm --filter @arkesoft/api exec vitest list
          (cd packages/db && pnpm exec prisma validate)
          node --env-file-if-exists=.env -e 'process.exit(0)'
          echo "AC12a: dört adım da .env dosyası OLMADAN başarıyla tamamlandı."

      - name: Changeset uyarısı (AC7) — engellemez
        # "always()": erken bir BLOKLAYICI adım kırmızıya dönerse bu danışma
        # uyarısı hiç koşmazdı ve PR yazarı geri bildirimi kaybederdi
        # (T-003 solid tur 1 low bulgu, devops C5).
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          git fetch origin "$BASE_REF" --depth=1 >/dev/null 2>&1 || true
          set +e
          pnpm changeset status --since "origin/$BASE_REF"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Bu PR için changeset bulunamadı (ya da karşılaştırma başarısız oldu). BLOKLAMIYOR — bu kontrol PR tipini sınıflandıramıyor (commit-lint/PR etiketi henüz yok). Muafsan PR şablonundaki Changeset kutusunda muafiyet sebebini işaretle, değilse 'pnpm changeset' ile ekle."
          else
            echo "Changeset durumu temiz."
          fi

      - name: PR gövdesi sürüm etiketi kontrolü (AC10) — engellemez
        # "always()": aynı gerekçe (yukarıdaki AC7 notu, devops C5).
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          if printf '%s' "$PR_BODY" | grep -Eq '\[v[0-9]+\.[0-9]+\.[0-9]+\]'; then
            echo "PR gövdesinde bir ROADMAP sürüm etiketi bulundu."
          else
            echo "::warning::PR gövdesinde [vX.Y.Z] biçiminde bir ROADMAP sürüm etiketi bulunamadı. BLOKLAMIYOR — şablonun 1. alanını ('Hangi ROADMAP versiyonu?') doldurun."
          fi

      - name: actionlint ikilisini indir ve doğrula (resmî release + SHA256)
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          # Kaynak: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          # (resmî release sayfasının yayınladığı checksum dosyasından alındı).
          expected_sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -sSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${expected_sha256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          chmod +x ./actionlint

      - name: actionlint — iş akışı dosyalarını denetle
        shell: bash
        run: |
          set -euo pipefail
          # actionlint yalnızca iş akışı (workflow) dosyalarını anlıyor;
          # composite action.yml dosyalarını STANDALONE hedef olarak
          # yazamıyor (farklı şema → "syntax-check" hatası üretir) ve
          # "uses: ./..." ile referans edilen yerel composite action'ların
          # içini (örn. eksik "shell:") doğrulamıyor — bu araçtaki bilinen
          # bir kapsam sınırı (yerel olarak doğrulandı). Composite
          # action'ların doğruluğu bu yüzden elle sağlanır: her "run:"
          # adımında açık bir "shell:" alanı vardır.
          ./actionlint

  # ---------------------------------------------------------------------
  # api — Postgres + Redis servisleriyle koşan, veritabanına bağlı hat.
  # İş container'ı KULLANILMAZ — job doğrudan runner'da koşar, servisler
  # localhost'a maplenir (T-003 K-B4, A-V21).
  # ---------------------------------------------------------------------
  api:
    name: api
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          # .env.example ile birebir aynı (dev-only, sır DEĞİL — T-003 K-B4).
          POSTGRES_USER: arkesoft
          POSTGRES_PASSWORD: arkesoft_dev_only
          POSTGRES_DB: arkesoft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkesoft -d arkesoft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # ⚠ Redis BU BLOKTA DEĞİL — bilinçli, ROADMAP v0.0.11.
      #
      # v0.0.11'in fail-closed kapısı (AC10 —
      # "apps/api/src/__tests__/helpers/assert-queue-capable-redis.ts")
      # kuyruk testlerinden ÖNCE çalışma anında "appendonly=yes" ve
      # "maxmemory-policy=noeviction" ÖLÇÜYOR. Redis'in varsayılanı
      # "appendonly=no" olduğu için ARGÜMANSIZ bir Redis bu kapıyı DOĞRU
      # şekilde kırmızıya çevirir (9016c7a'da ölçüldü: "api" job'unda 5 test
      # dosyası / 7 hata; altısı birebir kapının mesajı, yedincisi kapıda
      # düşen "beforeAll"ın "afterAll"a bıraktığı ikincil etki). Kapı bir
      # kusur DEĞİL, teşhis: kapı olmasaydı CI'ın kuyruk testleri KALICI
      # OLMAYAN bir Redis'e karşı koşup YANILTICI YEŞİL verirdi.
      #
      # GitHub Actions'ın "services" şemasında bu argümanları verecek bir alan
      # YOK. Üç yol da ÖLÇÜLDÜ, üçü de bu şemada çalışmıyor:
      #
      #   1) "command" alanı — ŞEMADA YOK. actionlint 1.7.12 (guards job'unun
      #      indirdiği sürümün AYNISI) birebir şunu diyor: 'unexpected key
      #      "command" for "services" section. expected one of "credentials",
      #      "env", "image", "options", "ports", "volumes"' → exit 1. Yani bu
      #      yol yalnızca çalışmıyor, "guards" job'unun "0 bulgu" şartını da
      #      kırıyor. (Bu yüzden "infra/docker-compose.yml:54"ün çözümü buraya
      #      BİREBİR KOPYALANAMIYOR — compose "command" kullanıyor.)
      #
      #   2) "options: --entrypoint …" — ARGÜMAN TAŞIMIYOR. İki biçim de
      #      ölçüldü: "--entrypoint redis-server" imajın CMD'sini SİLER ve
      #      Redis argümansız kalkar (CONFIG GET appendonly → 'no', kapı yine
      #      kırmızı); "--entrypoint 'redis-server --appendonly yes'" ise
      #      'executable file not found in $PATH' + exit 127 verir (docker'ın
      #      "--entrypoint"i TEK bir çalıştırılabilir alır, argüman listesi
      #      almaz).
      #
      #   3) "volumes:" ile bir redis.conf bağlamak — redis-server dosya
      #      yolunu BİR ARGÜMAN olarak almadıkça o dosyayı OKUMUYOR (ölçüldü:
      #      conf'ta "appendonly yes" yazılı olmasına rağmen CONFIG GET → 'no',
      #      INFO server'da "config_file:" BOŞ). Ayrıca servisler
      #      checkout'tan ÖNCE başladığı için repodaki bir dosya o anda henüz
      #      diskte DEĞİL.
      #
      # SEÇİLEN YOL (3. yol): Redis, aşağıdaki ilk adımda "docker run" ile
      # "infra/docker-compose.yml:54"ün BİREBİR AYNI argümanlarıyla
      # kaldırılıyor. Gerekçe ölçülmüş, estetik değil: yerelde kapının gördüğü
      # üçlü (appendonly='yes' · maxmemory-policy='noeviction' · save='60 1')
      # CI'da da BİREBİR aynı oluyor. Alternatif olan "servisi bırak, sonra
      # ayarı çalışma anında değiştir" yolu appendonly'yi düzeltirdi ama
      # "save"i imaj varsayılanında ('3600 1 300 100 60 10000') bırakırdı —
      # yani kapının TEŞHİS satırında yerel ile CI AYRIŞMAYA DEVAM ederdi; bu
      # Task'ın kovaladığı kusur sınıfı tam olarak bu (beyan ≠ gerçeklik).
      # Aynı disiplin Mailpit notunda da yazılı: yerel tanımla AYNI imaj/sürüm.
      #
      # --- (Redis notu burada bitiyor; aşağısı Mailpit servisine ait) ------
      #
      # Mailpit (A-G9, T-006/S1): `infra/docker-compose.yml`'daki yerel
      # tanımla AYNI imaj/sürüm (axllent/mailpit:v1.32). AC4'ün "Mailpit
      # HTTP API'sinden gerçekten teslim edilmiş mesaj okunur" gereksinimi
      # için SMTP (1025) VE HTTP API (8025) portlarının ikisi de gerekli.
      # Healthcheck `/readyz` — docker-compose'daki ile aynı komut
      # (`wget`, konteyner 127.0.0.1'de dinliyor; `localhost` DEĞİL — ::1
      # önce denenip "connection refused" verebiliyor).
      mailpit:
        image: axllent/mailpit:v1.32
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
          MP_MAX_MESSAGES: '2000'
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8025/readyz || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      # ROADMAP v0.0.11 — kuyruk-yetenekli Redis. Neden "services" bloğunda
      # DEĞİL: yukarıdaki üç ölçümlü gerekçeye bakın. Bu adım "setup-workspace"ten
      # ÖNCE: Redis kalkmazsa ~2 dakikalık kurulum/derleme harcanmadan, TEK bir
      # satırla kırmızı veriyoruz.
      - name: Kuyruk-yetenekli Redis'i ayağa kaldır (AC10 kapısının gereği)
        uses: ./.github/actions/start-queue-redis

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace

      - name: Veritabanını hazırla (migration + tohumlama)
        uses: ./.github/actions/prepare-db

      - name: Beşli kapıyı çalıştır
        uses: ./.github/actions/run-gates
        with:
          filter: '@arkesoft/api...'

  # ---------------------------------------------------------------------
  # admin / superadmin / storefront — kendi yoluna (+ bağımlı olduğu
  # paylaşılan paketlere) göre tetiklenen, servis gerektirmeyen hatlar.
  # Bugün üçü de kaynak kod içermeyen iskelet (ROADMAP v0.0.7/v0.0.20/
  # v0.0.8) — hat burada kurulur, içerik o sürümlerde gelir.
  # ---------------------------------------------------------------------
  admin:
    name: admin
    needs: plan
    if: needs.plan.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace

      - name: Beşli kapıyı çalıştır
        uses: ./.github/actions/run-gates
        with:
          filter: '@arkesoft/admin...'
          # ROADMAP v0.0.13 (T-005/S5, architect riski 8) — bu hat DB'siz;
          # "run-isolation" girdisinin varsayılanı fail-closed ('true') —
          # AÇIKÇA 'false' geçilmezse izolasyon süiti Postgres OLMADAN
          # koşmaya çalışır ve GÜRÜLTÜLÜ KIRMIZI verir (sessizce atlamak
          # yerine, bilinçli yön).
          run-isolation: 'false'

  superadmin:
    name: superadmin
    needs: plan
    if: needs.plan.outputs.superadmin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace

      - name: Beşli kapıyı çalıştır
        uses: ./.github/actions/run-gates
        with:
          filter: '@arkesoft/superadmin...'
          # ROADMAP v0.0.13 (T-005/S5, architect riski 8) — aynı gerekçe
          # (yukarıdaki "admin" job'undaki not).
          run-isolation: 'false'

  storefront:
    name: storefront
    needs: plan
    if: needs.plan.outputs.storefront == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace

      - name: Beşli kapıyı çalıştır
        uses: ./.github/actions/run-gates
        with:
          filter: '@arkesoft/storefront...'
          # ROADMAP v0.0.13 (T-005/S5, architect riski 8) — aynı gerekçe
          # (yukarıdaki "admin" job'undaki not).
          run-isolation: 'false'

  # ---------------------------------------------------------------------
  # shared — dört uygulama hattının kapanışına girmeyen paylaşılan
  # paketler (ui, integrations, theme-sdk, trpc + config/db/errors'ın
  # kendisi). "test" YOK: kendi test script'i olan paketler ya "api"
  # hattının kapanışında (db, errors, trpc) ya "admin" hattının
  # kapanışında (ui) ya da kendi ayrı hattında (theme-sdk — ROADMAP
  # v0.0.9, T-010/S9, R-A; aşağıdaki "theme-sdk" job'una bakın); burada
  # tekrar koşmak sessiz bir boşluk DOĞURMAZ (T-003 K-B2.7).
  #
  # GÜNCELLEME (ROADMAP v0.0.9, T-010/S9): bu yorum eskiden "theme-sdk …
  # test YOK" diyordu — bu artık YANLIŞ. `@arkesoft/theme-sdk` bir "test"
  # script'i kazandı (S1) ama ona `workspace:*` ile bağımlı HİÇBİR paket
  # yok, yani dört uygulama hattının kapanışına GİRMİYOR. Bu "shared"
  # job'u onu `./packages/**` filtresinde GÖRÜYOR ama `run-test: 'false'`
  # taşıyor — AYNI filtre `@arkesoft/db`'nin Postgres İSTEYEN süitini de
  # kapsıyor ve bu job Postgres provision ETMİYOR; burada "run-test"i
  # 'true' yapmak o süiti Postgres'siz bir job'a sokardı (gerileme).
  # Çözüm: theme-sdk kendi dar filtresiyle (`@arkesoft/theme-sdk...`),
  # DB gerektirmeyen ayrı bir job alır (aşağıda).
  # ---------------------------------------------------------------------
  shared:
    name: shared
    needs: plan
    if: needs.plan.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace

      - name: Lint + tip denetimi + derleme (test YOK)
        uses: ./.github/actions/run-gates
        with:
          # "./packages/*" DEĞİL — turbo'nun filtre glob'unda "*" dizin
          # ayırıcısını (/) GEÇMEZ; "packages/themes/<tema>" gibi İÇ İÇE bir
          # paket değişince tetikleyici küme ("plan" job'unun "shared_names"
          # türetimindeki "startswith(\"packages/\")" filtresi, iç içe
          # paketleri KAPSAR) ile bu tüketici birbirinden sapıyordu:
          # "shared=true" olurdu ama bu filtre değişen tema paketini HİÇ
          # görmezdi → iş "success" dönerdi, tema paketi lint/typecheck/build
          # görmeden geçerdi (T-003 solid tur 2 M2-4). "**" iki seviyeyi de
          # kapsar — geçici bir "packages/themes/probe" paketiyle ÖLÇÜLDÜ:
          # "--filter='./packages/*'" onu listelemedi, "--filter='./packages/**'"
          # listeledi (devops kanıtı, prob paketi silindi).
          filter: './packages/**'
          run-test: 'false'
          # ROADMAP v0.0.13 (T-005/S5, architect riski 8) — aynı gerekçe
          # (yukarıdaki "admin"/"superadmin"/"storefront" job'larındaki not).
          # "run-test: 'false'" izolasyon süitini DE kapatmaz — ikisi AYRI
          # girdi, ikisi de AÇIKÇA kapatılmak zorunda.
          run-isolation: 'false'

  # ---------------------------------------------------------------------
  # theme-sdk — @arkesoft/theme-sdk'nın "test" script'ini GERÇEKTEN
  # koşturan hat (ROADMAP v0.0.9, T-010/S9 — R-A'nın çözümü). theme-sdk'ya
  # `workspace:*` ile bağımlı hiçbir paket yok, bu yüzden dört uygulama
  # hattının (api/admin/superadmin/storefront) kapanışına girmiyor; yukarı
  # bakın — "shared" job'u onu görür ama `run-test: 'false'` taşır çünkü
  # aynı filtre (`./packages/**`) @arkesoft/db'nin Postgres isteyen
  # süitini de kapsar ve bu job Postgres provision ETMEZ. Dar filtre
  # (`@arkesoft/theme-sdk...`) theme-sdk'yı @arkesoft/db'den AYIRIR — bu
  # job'da db DEĞİL, yalnızca theme-sdk (bugün bağımlılığı yok →
  # kapanış = theme-sdk'nın kendisi) koşar; db'nin Postgres isteyen süiti
  # bu job'a HİÇ girmez (gerileme yok).
  # ---------------------------------------------------------------------
  theme-sdk:
    name: theme-sdk
    needs: plan
    if: needs.plan.outputs.themeSdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace

      - name: Beşli kapıyı çalıştır
        uses: ./.github/actions/run-gates
        with:
          filter: '@arkesoft/theme-sdk...'
          # theme-sdk'nın DB'ye erişimi yok, "test:isolation" script'i yok
          # — aynı gerekçe (yukarıdaki "admin"/"superadmin"/"storefront"
          # job'larındaki not).
          run-isolation: 'false'

  # ---------------------------------------------------------------------
  # e2e — Playwright uçtan uca + görsel regresyon (ROADMAP v0.0.19,
  # T-020/S8, ADR-0022). "run-gates"e BİLEREK GİRMEZ: "shared" job'unun
  # yukarıdaki yorumu "ikinci bir services: postgres, AYNI koşucu (Vitest)"
  # senaryosunu K-E9'da reddetmişti (adımlar ZATEN sıralı, kazanç sıfırdı) —
  # buradaki gerekçe FARKLI. Burada çoğaltılan Postgres + Redis + Mailpit +
  # tarayıcı + iki geliştirme sunucusu; kazanç PAYLAŞILAN DEĞİŞKEN kaynağın
  # (tek Postgres/Redis/Mailpit, tek IP oran-sınırı bütçesi) izolasyonu —
  # Playwright "run-gates"in "turbo run <görev>" çağrılarının aldığı
  # "assertSoleRunOwnership" kilidini HİÇ almıyor (po R-2). Bugün bu bir
  # YARIŞ DEĞİL (her CI job'u zaten taze Redis/Postgres ile başlıyor — "pm"
  # Ölçüm 1) — gerekçe yapısal kırılganlığın KALICI kapatılması.
  # ---------------------------------------------------------------------
  e2e:
    name: e2e
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # "api" job'uyla BİREBİR aynı imaj/env/health (yukarıdaki "api"
      # job'undaki Postgres notuna bakın — aynı üç ölçümlü gerekçe burada
      # TEKRARLANMADI).
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: arkesoft
          POSTGRES_PASSWORD: arkesoft_dev_only
          POSTGRES_DB: arkesoft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkesoft -d arkesoft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Mailpit — admin e2e'nin ("apps/admin/e2e/helpers/verified-fixture-
      # user.ts") e-posta doğrulama token'ını Mailpit'in HTTP API'sinden
      # okuması gerekiyor; "api" job'undakiyle BİREBİR aynı imaj/sürüm/env/
      # health (yukarıdaki "api" job'undaki Mailpit notuna bakın).
      mailpit:
        image: axllent/mailpit:v1.32
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
          MP_MAX_MESSAGES: '2000'
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8025/readyz || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Depoyu checkout et
        uses: actions/checkout@v4

      # "api" job'uyla AYNI gerekçe (yukarıya bakın) — Redis "services:"
      # bloğunda DEĞİL, "start-queue-redis" composite'i T-020/S2'de BUNUN
      # İÇİN (bu job'un da aynı Redis'e ihtiyaç duyması için) TEK TANIM
      # YERİNE taşındı.
      - name: Kuyruk-yetenekli Redis'i ayağa kaldır (AC10 kapısının gereği)
        uses: ./.github/actions/start-queue-redis

      - name: Çalışma alanını hazırla
        uses: ./.github/actions/setup-workspace

      - name: Veritabanını hazırla (migration + tohumlama)
        uses: ./.github/actions/prepare-db

      # admin/storefront'un kendi "test:e2e" görevi "turbo.json"daki
      # "dependsOn: [\"^build\", \"generate\"]" zinciri üzerinden kendi
      # paylaşılan paket bağımlılıklarını OTOMATİK derler (bayat-dist
      # tuzağı koruması, aynı mekanizma) — ama "@arkesoft/api" admin/
      # storefront'un workspace bağımlılığı DEĞİL (ayrı bir dağıtılabilir
      # uygulama), bu yüzden arka planda başlatılacak "dist/main.js" BURADA
      # AÇIKÇA derlenir ("prepare-db"nin "@arkesoft/db..." için kullandığı
      # AYNI teknik).
      - name: apps/api'yi derle (e2e'nin arka planda başlatacağı süreç)
        shell: bash
        run: pnpm exec turbo run build --filter='@arkesoft/api...'

      - name: Playwright tarayıcı önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # ⚠⚠ Gevşek "restore-keys" ÖNEĞİ BİLEREK YOK — "setup-workspace/
          # action.yml:55-63"ün AYNI yazılı güvenlik gerekçesi: bir önek,
          # kilit dosyasından BAĞIMSIZ herhangi bir eski tarayıcı önbelleğini
          # geri yükleyip "pnpm exec playwright install" adımının HİÇBİR ŞEY
          # YAPMADAN "başarılı" saydırmasına yüzey açardı.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Playwright tarayıcısını kur (yalnızca chromium)
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: apps/api'yi arka planda başlat ve /health/ready'yi probla
        shell: bash
        run: |
          set -euo pipefail
          # storefront'un "e2e/global-setup.ts:17-30"u apps/api'nin ÇALIŞIYOR
          # olmasını ÖN KOŞUL sayıyor (storefront SSR middleware'i her isteği
          # sunucu taraflı tRPC çağrısıyla çözüyor) — aksi hâlde Türkçe
          # teşhis hatası fırlatıp e2e süitini BAŞLAMADAN durduruyor.
          # "exec": alt kabuğun PROCESS İMAJI "node" ile DEĞİŞTİRİLİR —
          # "run-visual.sh"ın (T-020/S6) ölçtüğü "subshell pid, GERÇEK node
          # pid DEĞİL" tuzağının AYNISI burada da geçerli olurdu.
          (cd apps/api && exec node --env-file-if-exists=../../.env dist/main.js) \
            >/tmp/arkesoft-e2e-api.log 2>&1 &
          api_pid=$!
          echo "apps/api arka planda başlatıldı (pid $api_pid)."

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3000/health/ready" >/dev/null 2>&1; then
              ready=true
              echo "apps/api hazır (deneme $attempt)."
              break
            fi
            if ! kill -0 "$api_pid" >/dev/null 2>&1; then
              echo "::error::apps/api süreci (pid $api_pid) beklenmedik şekilde erken sonlandı."
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::apps/api 60 saniye içinde /health/ready üzerinden 2xx döndürmedi."
            cat /tmp/arkesoft-e2e-api.log
            exit 1
          fi

      # ROADMAP v0.0.19 (T-020/S9'un ölçeceği "AC-12 yük altında koşum"
      # şartı) — VARSAYILAN KAPALI, bir depo değişkeniyle açılır/kapanır.
      #
      # ⚠⚠ MEKANİZMA S9d'DE DEĞİŞTİ (ÖLÇÜLMÜŞ ARIZA). ÖNCEKİ tasarım (T-019
      # düzeltme turu 4'ten taşınan "redis-cli EVAL" busy-loop, 40 eşzamanlı
      # SONSUZ döngü) gerçek yük koşumunda ("ARKESOFT_E2E_SYNTHETIC_LOAD=1"
      # ile tetiklenen koşum) "test:e2e"de 4 testi düşürdü — ÜÇÜ aynı satırda
      # ("expect(signUpResponse.ok()).toBe(true)"). Kök neden burada ÖLÇÜLDÜ
      # (devops S9d, yerel ölçüm — "arkesoft-load-test-redis" adlı geçici
      # konteyner, redis:8.10-alpine, port 16380, Docker Desktop/macOS):
      # Redis TEK İŞ PARÇACIKLI; 8 eşzamanlı SONSUZ EVAL busy-loop'u ALTINDA
      # TEK bir PING 15339 ms sürdü (yüksüz PING: 76-111 ms). "apps/api/src/
      # redis/create-redis-connection.ts:60"taki "'health'" profilinin
      # "HEALTH_COMMAND_TIMEOUT_MS = 1500" sabiti bu süre AŞILINCA
      # "apps/api/src/auth/rate-limit/rate-limit.service.ts:154-158"
      # "RateLimitStoreUnavailableError" (503, FAIL-CLOSED — BİLİNÇLİ,
      # security tur2 S-7, "apps/api/src/**" BU TURDA DEĞİŞTİRİLMEDİ) FIRLATIR.
      # Yani sign-up DOĞRU şekilde REDDEDİLDİ; kusur ÜRÜNDE değil, YÜK
      # ÜRETECİNDEYDİ — "makine meşgul" yerine "Redis TAMAMEN YOK" simüle
      # ediyordu (AC-12'nin niyeti BU DEĞİL).
      #
      # DÜZELTME — yön (C), CPU/IO + Redis'e DOKUNAN-ama-BLOKE-ETMEYEN
      # trafiğin BİRLEŞİMİ:
      #   (A) CPU yükü Redis'e HİÇ DOKUNMADAN — "nproc" kadar sıkı döngü
      #       işçisi runner'ın CPU'sunu doyurur (genel rekabet/yavaşlama).
      #       T-019'un "yes ile CPU yüklemek KANIT DEĞİLDİ" dersiyle (AGENT_
      #       BASELINE §4 ders 2) ÇELİŞMEZ — o ders KÖK NEDENİ TEŞHİS ETMEK
      #       (I/O beklemesi) içindi; burada amaç GENEL makine yükü.
      #   (B) disk I/O yükü — "ionice -c3" (DÜŞÜK öncelik; Postgres/
      #       Playwright'ın disk erişimini AÇ BIRAKMAZ, tamamen BOĞMAZ) ile
      #       tekrarlanan "dd" yazması + "conv=fsync" (sayfa önbelleğinde
      #       KALMAZ, gerçek diske YAZDIRILIR).
      #   (C) Redis KOMUT trafiği KALDI ama "EVAL" busy-loop YOK — düz SET/
      #       GET (her komut mikrosaniye mertebesinde, uzun BLOKE EDEN tek
      #       komut YOK). Yerel ölçüm (yukarıdaki not — aynı geçici konteyner):
      #       8 CPU işçisi + 20 eşzamanlı SET/GET işçisi ALTINDA 10 ardışık
      #       PING ortalama 283 ms / maksimum 362 ms — "HEALTH_COMMAND_
      #       TIMEOUT_MS = 1500"ün ÇOK altında; 1 dakikalık load average
      #       3.03'ten 8.87'ye ÇIKTI (gerçek yük KANITI, "adım koştu" DEĞİL).
      #
      # "vars." İFADESİ BİLEREK YALNIZCA "if:" İÇİNDE — "run:" bloğunun
      # İÇİNDE KULLANILMADI (guards'ın "run bloğu içi şablon ifadesi
      # yasağı" adımını kırardı).
      - name: Sentetik makine yükü (varsayılan KAPALI — AC-12 yük koşumu)
        if: ${{ vars.ARKESOFT_E2E_SYNTHETIC_LOAD == '1' }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo '## Sentetik makine yükü — ölçüm'
            echo
            echo "Yük ÖNCESİ load average: $(cat /proc/loadavg)"
            echo "Yük ÖNCESİ çalışan konteyner sayısı: $(docker ps -q | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

          # (A) CPU yükü — Redis'e DOKUNMADAN.
          cpu_workers="$(nproc)"
          for _ in $(seq 1 "$cpu_workers"); do
            ( while :; do :; done ) &
          done

          # (B) disk I/O yükü — düşük öncelik, tekrarlanan GERÇEK yazma
          # ("conv=fsync" — sayfa önbelleğinde kalmaz).
          (
            while :; do
              ionice -c3 dd if=/dev/zero of=/tmp/arkesoft-synthetic-io bs=1M count=32 conv=fsync >/dev/null 2>&1 || true
            done
          ) &
          rm -f /tmp/arkesoft-synthetic-io 2>/dev/null || true

          # (C) Redis KOMUT trafiği — EVAL busy-loop YOK, düz SET/GET.
          for worker in $(seq 1 20); do
            (
              while :; do
                docker exec arkesoft-ci-redis redis-cli SET "arkesoft:synthetic-load:$worker" "$(date +%s%N)" >/dev/null 2>&1 || true
                docker exec arkesoft-ci-redis redis-cli GET "arkesoft:synthetic-load:$worker" >/dev/null 2>&1 || true
              done
            ) &
          done

          disown -a 2>/dev/null || true

          # Yükün RAMPA olması için kısa bekleme, sonra gerçek ölçüm —
          # "adım koştu" YETMEZ, aşağıdaki sayılar kanıt.
          sleep 3

          ping_total_ms=0
          {
            echo
            echo "Yük ALTINDA load average: $(cat /proc/loadavg)"
          } >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 5); do
            ping_start_ns="$(date +%s%N)"
            docker exec arkesoft-ci-redis redis-cli PING >/dev/null 2>&1 || true
            ping_end_ns="$(date +%s%N)"
            ping_ms=$(( (ping_end_ns - ping_start_ns) / 1000000 ))
            echo "Redis PING örnek $attempt (yük altında): ${ping_ms} ms" >> "$GITHUB_STEP_SUMMARY"
            ping_total_ms=$(( ping_total_ms + ping_ms ))
          done
          echo "Redis PING ortalaması (yük altında, 5 örnek): $(( ping_total_ms / 5 )) ms — HEALTH_COMMAND_TIMEOUT_MS (1500 ms) ile karşılaştırılmalı." >> "$GITHUB_STEP_SUMMARY"

          echo "Sentetik makine yükü başlatıldı ($cpu_workers CPU işçisi + 1 disk I/O döngüsü + 20 Redis SET/GET işçisi; EVAL busy-loop YOK)."

      - name: E2E süitini çalıştır (pnpm test:e2e)
        shell: bash
        run: pnpm test:e2e

      - name: Görsel regresyonu çalıştır (pnpm test:visual)
        shell: bash
        env:
          # R-11 (po/architect, T-020) — görsel projenin ÜRETİM sunucusu
          # "astro dev"in AKSİNE kök ".env"i OKUMUYOR
          # ("createRootEnvIntegration()" yalnızca "dev" dalında yükleniyor,
          # "astro.config.ts:46-49"). Bu yüzden bu iki değer BURADA AÇIKÇA
          # verilir — "scripts/run-visual.sh"ın KENDİ
          # "STOREFRONT_API_BASE_URL_OVERRIDE" varsayılanı (3100) bu job'un
          # "apps/api"yi dinlettiği portla (3000 — ".env.example"in
          # kendisiyle TUTARLI) UYUŞMUYOR; örtük bırakmak TAM OLARAK bu
          # sürümün kovaladığı "beyan ≠ gerçeklik" sınıfı olurdu.
          APP_BASE_DOMAIN: arkesoft.localhost
          STOREFRONT_API_BASE_URL_OVERRIDE: http://127.0.0.1:3000
        run: pnpm test:visual

      # R-9 (po, T-020) — trace/video/screenshot OTURUM ÇEREZİ ve
      # "Authorization" BAŞLIĞI taşır; "scripts/playwright/base.ts" (S4)
      # "trace:'on-first-retry'" + "video:'retain-on-failure'" ile bunu
      # AZALTTI, "retention-days" zincirin SON halkası. "if: always()":
      # başarısız koşumda artefakt EN DEĞERLİ olduğu an.
      - name: Playwright artefaktlarını yükle (trace + video + screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-artifacts
          path: |
            apps/*/test-results
            apps/*/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------
  # ci-gate — TEK toplayıcı (aggregate) check (AC9). Varsayılan-reddet:
  # izinli küme {success, skipped}, dışındaki HER DEĞER (failure,
  # cancelled, ileride eklenecek yeni bir değer) başarısızlık sayılır.
  # "contains(needs.*.result, 'failure')" deseni BİLEREK KULLANILMAZ —
  # o ifade "cancelled"ı ve ileride eklenecek yeni bir sonuç değerini
  # sessizce yeşil bırakır (T-003 K-B3).
  # ---------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    if: always()
    needs: [plan, repo, guards, api, admin, superadmin, storefront, shared, theme-sdk, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sonuçları değerlendir (varsayılan-reddet)
        shell: bash
        env:
          # env: üzerinden — run: bloğunun içinde "${{ }}" YOK (bkz. "plan"
          # job'undaki "refs" adımının aynı gerekçeli notu).
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" > /tmp/needs.json

          {
            echo '## ci-gate — hat sonuçları'
            echo
            echo '| İş | Sonuç |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          # Denetlenecek job listesi ELLE YAZILMAZ — yukarıdaki "needs:" alanının
          # kendisinden (toJSON(needs)) türetilir. Önceki tasarımda bu liste İKİ
          # yerde (burada ve "needs:" alanında) ayrı ayrı elle tutuluyordu;
          # "needs:"e eklenip buraya eklenmeyen bir job'ın "failure" sonucu hiç
          # okunmazdı (sessiz sahte yeşil, T-003 solid tur 1 M1 / T3-4 / R-7).
          # Tersi yön zaten güvenliydi ve öyle kalıyor: "needs:"te OLMAYAN bir ad
          # için jq "null" döner, "*" dalına düşer.
          # Job adları BİR DEĞİŞKENE atanarak okunuyor — süreç ikamesine
          # (`< <(…)`) DEĞİL. Süreç ikamesinin çıkış kodu "set -euo pipefail"
          # tarafından görülmez (bash'in kendi semantiği): "jq" çökerse/boş
          # JSON üretirse "while" sıfır kez döner, "ok=true" kalır ve bu adım
          # "PASS" diyerek 0 ile çıkardı — tek toplayıcı check'in varsayılan-
          # reddet tasarımını fail-open'a çeviren SESSİZ bir sahte yeşil
          # (T-003 solid tur 2 M2-1). Düzeltme: önce değişkene al (`set -e`
          # bunu GÖRÜR) ve boşluğa karşı AÇIKÇA iddia et.
          if ! job_names="$(jq -r 'keys[]' /tmp/needs.json)"; then
            echo "::error::ci-gate: needs listesi ayrıştırılamadı (jq /tmp/needs.json üzerinde başarısız oldu) — fail-closed."
            exit 1
          fi
          if [ -z "$job_names" ]; then
            echo "::error::ci-gate: needs listesi boş (jq hiçbir anahtar üretmedi) — fail-closed."
            exit 1
          fi

          ok=true
          while IFS= read -r job_name; do
            [ -z "$job_name" ] && continue
            result="$(jq -r --arg j "$job_name" '.[$j].result' /tmp/needs.json)"
            echo "| $job_name | $result |" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              success|skipped) ;;
              *) ok=false ;;
            esac
          done <<< "$job_names"

          if [ "$ok" = false ]; then
            echo "::error::ci-gate: en az bir iş beklenen küme {success, skipped} dışında bir sonuçla bitti."
            exit 1
          fi
          echo "ci-gate: tüm işler {success, skipped} kümesinde — PASS."
